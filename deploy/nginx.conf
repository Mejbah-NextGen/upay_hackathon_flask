worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 15s;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 35s;
    client_max_body_size 6m;

    # Do not retain IPs, paths, query strings, auth headers or bodies in logs.
    map $upstream_http_x_request_id $audit_request_id {
        "" $request_id;
        default $upstream_http_x_request_id;
    }
    log_format safe '{"event":"gateway.request","request_id":"$audit_request_id","status":$status,"duration_s":$request_time}';
    access_log /dev/stdout safe;

    limit_req_zone $binary_remote_addr zone=all_requests:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_requests:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_requests:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream application {
        server web:8000;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        server_name _;
        return 444;
    }

    server {
        # Local HTTP lab. Add verified TLS termination before browser sign-in.
        listen 8080;
        server_name localhost 127.0.0.1;
        limit_conn connections 20;
        limit_req zone=all_requests burst=60 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite untrusted forwarding headers: ProxyFix trusts one hop only.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 35s;
        proxy_read_timeout 35s;
        proxy_buffering on;
        proxy_request_buffering on;
        proxy_intercept_errors off;

        location ~ ^/auth/(login|signup|otp)$ {
            client_max_body_size 16k;
            limit_req zone=all_requests burst=60 nodelay;
            limit_req zone=auth_requests burst=5 nodelay;
            proxy_pass http://application;
        }

        location /api/ {
            client_max_body_size 64k;
            limit_req zone=all_requests burst=60 nodelay;
            limit_req zone=api_requests burst=40 nodelay;
            proxy_pass http://application;
        }

        location / {
            proxy_pass http://application;
        }
    }
}
