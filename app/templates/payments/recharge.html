{% extends 'base.html' %}
{% block title %}Mobile Recharge · {{ app_name }}{% endblock %}
{% block content %}
<div class="page-heading"><div><span class="eyebrow">Payment</span><h1>Mobile Recharge</h1><p>Choose an operator and recharge using demo balance.</p></div></div>
<section class="section-card form-card narrow-card">
  <form method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Operator
      <select name="operator" required>
        <option value="" {% if values.get('operator', '') not in operators %}selected{% endif %}>Choose an operator</option>
        {% for operator in operators %}<option value="{{ operator }}" {% if values.get('operator') == operator %}selected{% endif %}>{{ operator }}</option>{% endfor %}
      </select>
    </label>
    <label>Mobile Number<input name="mobile" value="{{ values.get('mobile', '') }}" type="tel" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX" maxlength="24" required></label>
    <label>Amount (BDT)<input name="amount" value="{{ values.get('amount', '') }}" type="number" min="0.01" max="100000" step="0.01" inputmode="decimal" placeholder="100.00" required></label>
    <div class="amount-chips"><button type="button" data-amount="50">৳50</button><button type="button" data-amount="100">৳100</button><button type="button" data-amount="200">৳200</button><button type="button" data-amount="500">৳500</button></div>
    <p class="muted">Demo recharge reduces wallet balance and appears in History. No airtime is delivered.</p>
    <button class="btn btn-primary" type="submit">Recharge with Demo Balance</button>
  </form>
</section>
{% endblock %}
